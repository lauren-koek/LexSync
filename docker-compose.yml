services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexsync}
      POSTGRES_DB: ${POSTGRES_DB:-lexsync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      DATABASE_URL: ${DATABASE_URL:-postgresql://lexsync:lexsync@postgres:5432/lexsync}
    volumes:
      - ./scraper/output:/app/scraper/output
    restart: unless-stopped

volumes:
  postgres_data:
