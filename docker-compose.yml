services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexsync}
      POSTGRES_DB: ${POSTGRES_DB:-lexsync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexsync}:${POSTGRES_PASSWORD:-lexsync}@postgres:5432/${POSTGRES_DB:-lexsync}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    restart: unless-stopped

  pipeline:
    build: .
    command: ["/app/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexsync}:${POSTGRES_PASSWORD:-lexsync}@postgres:5432/${POSTGRES_DB:-lexsync}
      PIPELINE_INTERVAL_HOURS: ${PIPELINE_INTERVAL_HOURS:-24}
      SCRAPER_DAYS: ${SCRAPER_DAYS:-7}
    volumes:
      - ./backend/scraper/output:/app/backend/scraper/output
    restart: unless-stopped

volumes:
  postgres_data:
