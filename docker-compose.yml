services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexsync}
      POSTGRES_DB: ${POSTGRES_DB:-lexsync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
